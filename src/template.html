<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Weather App</title>
  </head>
  <body>
    <header class="main-header">
      <h1 class="main-heading">Weather App</h1>
      <form class="js-search-form">
        <input
          type="text"
          placeholder="France"
          class="location-input js-location-input"
          id="location-input"
        />
        <button type="submit" class="search-form-submit-btn">Search</button>
      </form>
    </header>
    <div class="container">
      <div class="loading-spinner-container js-loading-spinner-container">
        <span class="loading-spinner"></span>
      </div>
      <main class="main js-main">
        <div class="location-menu-btn-container">
          <h3 class="location js-location"></h3>
          <div class="menu-btn-container">
            <button class="menu-btn js-menu-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path
                  d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z"
                />
              </svg>
            </button>
            <div class="menu js-menu">
              <div class="scale-radios-container">
                <div class="radio-label-container">
                  <input
                    type="radio"
                    name="scale"
                    id="celsius"
                    value="celsius"
                    checked
                  />
                  <label for="celsius">Celsius</label>
                </div>
                <div class="radio-label-container">
                  <input
                    type="radio"
                    name="scale"
                    id="fahrenheit"
                    value="fahrenheit"
                  />
                  <label for="fahrenheit">Fahrenheit</label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <section class="current-weather">
          <div class="current-weather-left">
            <h4
              class="current-weather-day-time js-current-weather-day-time"
            ></h4>
            <div class="current-weather-icon-temp-feels-like">
              <img class="current-weather-icon js-current-weather-icon" />
              <div>
                <p class="current-weather-temp js-current-weather-temp"></p>
                <p class="secondary-text">
                  Feels like <span class="js-current-weather-feels-like"></span>
                </p>
              </div>
            </div>
          </div>
          <div class="current-weather-right secondary-text">
            <p
              class="current-weather-condition js-current-weather-condition"
            ></p>
            <p>
              Precipitation: <span class="js-current-weather-precip"></span>
            </p>
            <p>Humidity: <span class="js-current-weather-humidity"></span></p>
            <p>Wind: <span class="js-current-weather-wind"></span></p>
          </div>
        </section>
        <ul class="cards js-incoming-hours-cards"></ul>
        <ul class="cards js-incoming-days-cards"></ul>
      </main>
    </div>
  </body>
</html>
